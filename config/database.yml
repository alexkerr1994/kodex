# PostgreSQL. Versions 9.3 and up are supported.
#
# Install the pg driver:
#   gem install pg
# On macOS with Homebrew:
#   gem install pg -- --with-pg-config=/opt/homebrew/opt/postgresql@17/bin/pg_config
#
default: &default
  adapter: postgresql
  encoding: unicode
  # For details on connection pooling, see Rails configuration guide
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: kodex_development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: kodex_test

# Single database for production. Solid Cache/Queue/Cable tables live in this same
# database (their migrations are in db/migrate), so one managed Postgres (Railway's
# DATABASE_URL) backs the whole app — no separate cache/queue/cable databases.
production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
